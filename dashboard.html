<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phyzelyne — Dashboard</title>
  <link rel="icon" type="image/png" href="Phyzelyne's Logo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="phyzelyne-theme.css">
  <link rel="stylesheet" href="phyzelyne-polish.css">
</head>
<body>

<div id="sidebar-mount"></div>

<div class="app-shell">
  <main class="main-content">
    <div class="page-header">
      <h1 id="greeting-text">Good morning 👋</h1>
      <p class="page-date" id="today-date"></p>
    </div>

    <!-- Stats -->
    <div class="stats-grid" id="stats-grid"></div>

    <!-- Two columns -->
    <div id="dash-grid">

      <!-- Recent Transactions -->
      <div class="glass-card" style="padding:28px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
          <div class="section-title"><i class="fas fa-clock-rotate-left"></i> Recent Transactions</div>
          <a href="transactions.html" class="btn btn-glass btn-sm">View All</a>
        </div>
        <div class="txn-list" id="recent-txn-list"></div>
      </div>

      <!-- Right column -->
      <div id="dash-side-column">

        <!-- Quick Add -->
        <div class="glass-card" style="padding:24px;">
          <div class="section-title" style="margin-bottom:16px;"><i class="fas fa-plus-circle"></i> Quick Add</div>
          <div class="type-toggle">
            <button class="type-btn income active" id="quick-income" onclick="setQuickType('income')">
              <i class="fas fa-plus"></i> Income
            </button>
            <button class="type-btn expense" id="quick-expense" onclick="setQuickType('expense')">
              <i class="fas fa-minus"></i> Expense
            </button>
            <button class="type-btn subscription" id="quick-subscription" onclick="setQuickType('subscription')">
              <i class="fas fa-repeat"></i> Sub
            </button>
          </div>
          <div class="form-group">
            <input type="text" class="form-input" id="q-desc" placeholder="Description">
          </div>
          <div class="form-group">
            <input type="number" class="form-input" id="q-amount" placeholder="Amount" min="0" step="0.01">
          </div>
          <div class="form-group" id="q-group-cat">
            <select class="form-input" id="q-cat"></select>
          </div>
          <div class="form-group" id="q-group-cycle" style="display:none;">
            <select class="form-input" id="q-cycle">
              <option value="weekly">Weekly</option>
              <option value="monthly" selected>Monthly</option>
              <option value="yearly">Yearly</option>
            </select>
          </div>
          <div class="form-group" id="q-group-photo" style="display:none;">
            <div style="display:flex; gap:10px; align-items:center;">
              <div id="q-photo-preview-container" style="width: 48px; height: 48px; border-radius: 8px; border: 1px dashed var(--gold-border); display:flex; align-items:center; justify-content:center; overflow:hidden; background: var(--glass-dim); flex-shrink:0;">
                <span id="q-photo-placeholder" style="font-size:0.58rem; color:var(--text-dim); text-align:center; padding: 2px;">No Photo</span>
                <img id="q-photo-preview" style="display:none; width: 100%; height: 100%; object-fit: cover;">
              </div>
              <div style="display:flex; flex-direction:column; gap:6px; flex:1;">
                <div style="display:flex; gap:6px;">
                  <label class="btn btn-glass btn-sm" style="cursor: pointer; margin: 0; padding: 6px 10px; font-size: 0.7rem; flex:1; justify-content:center; display:inline-flex; align-items:center; gap:4px;">
                    <i class="fas fa-upload"></i> Upload
                    <input type="file" id="q-photo-input" accept="image/*" style="display: none;" onchange="handleQuickPhotoUpload(event)">
                  </label>
                  <button class="btn btn-glass btn-sm" id="q-btn-take-photo" onclick="startQuickCamera()" style="padding: 6px 10px; font-size: 0.7rem; flex:1; justify-content:center; display:inline-flex; align-items:center; gap:4px;">
                    <i class="fas fa-camera"></i> Camera
                  </button>
                </div>
                <button class="btn btn-danger btn-sm" id="q-btn-remove-photo" onclick="removeQuickPhoto()" style="display: none; padding: 4px 10px; font-size: 0.7rem; width:100%; justify-content:center; align-items:center; gap:4px;">
                  <i class="fas fa-circle-xmark"></i> Remove Photo
                </button>
              </div>
            </div>
            <div id="q-camera-container" style="display:none; margin-top:10px; flex-direction:column; gap:8px; border: 1px solid var(--gold-border); border-radius: 8px; padding: 8px; background: var(--surface);">
              <video id="q-camera-feed" autoplay playsinline style="width:100%; max-height:150px; border-radius:4px; object-fit:cover; background:#000;"></video>
              <div style="display:flex; gap:8px;">
                <button class="btn btn-gold btn-sm" style="flex:1; justify-content:center; display:inline-flex; align-items:center; gap:4px;" onclick="captureQuickPhoto()"><i class="fas fa-circle"></i> Capture</button>
                <button class="btn btn-glass btn-sm" style="flex:1; justify-content:center; display:inline-flex; align-items:center; gap:4px;" onclick="stopQuickCamera()"><i class="fas fa-times"></i> Cancel</button>
              </div>
            </div>
          </div>
          <button class="btn btn-gold" style="width:100%;" onclick="quickAdd()">
            <i class="fas fa-plus"></i> Add Transaction
          </button>
        </div>

        <!-- Phyzelyne AI Tip -->
        <div class="glass-card" style="padding:24px;">
          <div class="section-title" style="margin-bottom:16px;"><i class="fas fa-brain"></i> Phyzelyne AI</div>
          <div id="dash-ai-tip"></div>
          <a href="cofe.html" class="btn btn-glass btn-sm" style="width:100%;justify-content:center;margin-top:4px;">
            Ask Phyzelyne AI <i class="fas fa-arrow-right"></i>
          </a>
        </div>

      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>Auth.require();</script>

<script>
  /* ── Category lists (kept in sync with transactions.html) ── */
  const CATS_INCOME  = [
    'salary','freelance','investment','bonus','commission',
    'pension','rental income','dividends','allowance','gift','other'
  ];
  const CATS_EXPENSE = [
    // Food
    'groceries','dining','coffee',
    // Home
    'rent','mortgage','bills','utilities','internet','repairs','cleaning',
    // Transport
    'transport','fuel','parking','toll',
    // Lifestyle
    'entertainment','streaming','gaming','books','sports','gym',
    // Personal
    'clothing','beauty','haircut','health','medical','dental','pharmacy',
    'personal','laundry',
    // Family
    'childcare','pets','gifts',
    // Education & Work
    'education','shopping','travel',
    // Finance
    'insurance','subscriptions','transfer','payment','loan repayment','tax',
    'charity','other'
  ];

  let quickType = 'income';
  let quickPhotoBase64 = null;
  let quickVideoStream = null;

  function getQuickCatsForType(type) {
    if (type === 'income') return CATS_INCOME;
    if (type === 'subscription') return ['subscriptions'];
    return CATS_EXPENSE;
  }

  function setQuickType(type) {
    quickType = type;
    document.getElementById('quick-income').classList.toggle('active', type === 'income');
    document.getElementById('quick-expense').classList.toggle('active', type === 'expense');
    document.getElementById('quick-subscription').classList.toggle('active', type === 'subscription');

    const descInput  = document.getElementById('q-desc');
    const cycleGroup = document.getElementById('q-group-cycle');
    const catGroup   = document.getElementById('q-group-cat');
    const photoGroup = document.getElementById('q-group-photo');

    photoGroup.style.display = type === 'expense' ? 'block' : 'none';
    if (type !== 'expense') stopQuickCamera();

    if (type === 'subscription') {
      descInput.placeholder = 'e.g. Netflix, Spotify';
      cycleGroup.style.display = 'block';
      catGroup.style.display = 'none';
    } else {
      descInput.placeholder = 'Description';
      cycleGroup.style.display = 'none';
      catGroup.style.display = 'block';
      populateCatSelect();
    }
  }

  function populateCatSelect() {
    const sel = document.getElementById('q-cat');
    const cats = getQuickCatsForType(quickType);
    sel.innerHTML = cats.map(c => `<option value="${c}">${c.charAt(0).toUpperCase()+c.slice(1)}</option>`).join('');
  }

  /* ── Receipt photo: upload + camera (kept in sync with transactions.html) ── */
  async function startQuickCamera() {
    const container = document.getElementById('q-camera-container');
    const video = document.getElementById('q-camera-feed');
    if (!container || !video) return;
    container.style.display = 'flex';
    try {
      quickVideoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      video.srcObject = quickVideoStream;
    } catch (err) {
      showToast('Could not access camera', 'error');
      container.style.display = 'none';
    }
  }

  function stopQuickCamera() {
    if (quickVideoStream) {
      quickVideoStream.getTracks().forEach(track => track.stop());
      quickVideoStream = null;
    }
    const container = document.getElementById('q-camera-container');
    if (container) container.style.display = 'none';
  }

  function captureQuickPhoto() {
    const video = document.getElementById('q-camera-feed');
    if (!quickVideoStream || !video) return;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
    const img = new Image();
    img.onload = function() {
      compressQuickImage(img, function(compressedBase64) {
        setQuickPhoto(compressedBase64);
        stopQuickCamera();
      });
    };
    img.src = dataUrl;
  }

  function handleQuickPhotoUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 1024 * 1024 * 5) { showToast('Image is too large. Keep it under 5MB', 'error'); return; }
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        compressQuickImage(img, function(compressedBase64) {
          setQuickPhoto(compressedBase64);
        });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function compressQuickImage(img, callback) {
    const canvas = document.createElement('canvas');
    const max_size = 800;
    let width = img.width, height = img.height;
    if (width > height) {
      if (width > max_size) { height *= max_size / width; width = max_size; }
    } else {
      if (height > max_size) { width *= max_size / height; height = max_size; }
    }
    canvas.width = width;
    canvas.height = height;
    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
    callback(canvas.toDataURL('image/jpeg', 0.7));
  }

  function setQuickPhoto(base64Data) {
    quickPhotoBase64 = base64Data;
    const preview = document.getElementById('q-photo-preview');
    const placeholder = document.getElementById('q-photo-placeholder');
    const removeBtn = document.getElementById('q-btn-remove-photo');
    if (preview && placeholder && removeBtn) {
      preview.src = base64Data;
      preview.style.display = 'block';
      placeholder.style.display = 'none';
      removeBtn.style.display = 'inline-flex';
    }
  }

  function removeQuickPhoto() {
    quickPhotoBase64 = null;
    const preview = document.getElementById('q-photo-preview');
    const placeholder = document.getElementById('q-photo-placeholder');
    const removeBtn = document.getElementById('q-btn-remove-photo');
    const input = document.getElementById('q-photo-input');
    if (preview && placeholder && removeBtn) {
      preview.src = '';
      preview.style.display = 'none';
      placeholder.style.display = 'block';
      removeBtn.style.display = 'none';
    }
    if (input) input.value = '';
    stopQuickCamera();
  }

  function quickAdd() {
    const descInput = document.getElementById('q-desc').value.trim();
    const amount = parseFloat(document.getElementById('q-amount').value);
    if (!descInput) { showToast(quickType === 'subscription' ? 'Enter a service or app name' : 'Add a description', 'error'); return; }
    if (!amount || amount <= 0) { showToast('Enter a valid amount', 'error'); return; }

    let type = quickType;
    let description = descInput;
    let category = '';

    if (quickType === 'subscription') {
      type = 'expense';
      const cycle = document.getElementById('q-cycle').value;
      description = `${descInput} [${cycle}]`;
      category = 'subscriptions';
    } else {
      category = document.getElementById('q-cat').value;
    }

    let image = null;
    if (quickType === 'expense' && quickPhotoBase64) image = quickPhotoBase64;

    Store.addTransaction({ type, amount, description, category, image });
    showToast(`${quickType === 'income' ? 'Income' : quickType === 'subscription' ? 'Subscription' : 'Expense'} added!`);
    document.getElementById('q-amount').value = '';
    document.getElementById('q-desc').value = '';
    if (quickType === 'subscription') document.getElementById('q-cycle').value = 'monthly';
    removeQuickPhoto();
    renderPage();
  }

  function renderStats() {
    const txns   = Store.getTransactions();
    const month  = Utils.filterByPeriod(txns, 'month');
    const totals = Utils.calcTotals(month);
    const allTotals = Utils.calcTotals(txns);

    const now = new Date();
    const monthLabel = now.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    document.getElementById('stats-grid').innerHTML = `
      <div class="glass-card stat-card pressable">
        <div class="stat-label"><i class="fas fa-wallet"></i> Total Balance</div>
        <div class="stat-value ${allTotals.balance >= 0 ? 'balance' : 'expense'}">${Utils.formatCurrency(allTotals.balance)}</div>
        <div class="stat-change">All time net</div>
      </div>
      <div class="glass-card stat-card pressable">
        <div class="stat-label"><i class="fas fa-arrow-down"></i> Income This Month</div>
        <div class="stat-value income">${Utils.formatCurrency(totals.income, true)}</div>
        <div class="stat-change">${monthLabel}</div>
      </div>
      <div class="glass-card stat-card pressable">
        <div class="stat-label"><i class="fas fa-arrow-up"></i> Expenses This Month</div>
        <div class="stat-value expense">${Utils.formatCurrency(totals.expense, true)}</div>
        <div class="stat-change">${monthLabel}</div>
      </div>
      <div class="glass-card stat-card pressable">
        <div class="stat-label"><i class="fas fa-chart-line"></i> Net This Month</div>
        <div class="stat-value ${totals.balance >= 0 ? 'income' : 'expense'}">${Utils.formatCurrency(totals.balance)}</div>
        <div class="stat-change">${totals.balance >= 0 ? '▲ Positive' : '▼ Deficit'}</div>
      </div>`;
  }

  function parseTxn(t) {
    if (!t) return null;
    const match = (t.description || '').match(/(.*) \[(weekly|monthly|yearly)\]$/);
    if (match) {
      return {
        ...t,
        uiType: 'subscription',
        uiDesc: match[1],
        cycle: match[2]
      };
    }
    return {
      ...t,
      uiType: t.type,
      uiDesc: t.description || '',
      cycle: null
    };
  }

  function renderRecentTxns() {
    const txns = Store.getTransactions().slice(0, 6);
    const el   = document.getElementById('recent-txn-list');
    if (!txns.length) {
      el.innerHTML = `<div class="empty-state"><i class="fas fa-receipt"></i><p>No transactions yet.<br>Add your first one!</p></div>`;
      return;
    }
    el.innerHTML = txns.map(parseTxn).map(t => {
      let icon = Utils.getCategoryIcon(t.category);
      if (t.uiType === 'subscription') {
        icon = 'fa-repeat';
      }
      const badgeText = t.uiType === 'subscription'
        ? `${t.category} • ${t.cycle.charAt(0).toUpperCase() + t.cycle.slice(1)}`
        : t.category;

      return `
      <div class="txn-item">
        <div class="txn-icon ${t.uiType}"><i class="fas ${icon}"></i></div>
        <div class="txn-info">
          <div class="txn-name">${t.uiDesc}</div>
          <div class="txn-meta">
            <span class="txn-cat-badge">${badgeText}</span>
            ${Utils.formatDate(t.date)}
          </div>
        </div>
        <div class="txn-amount ${t.uiType}">${t.uiType === 'income' ? '+' : '-'}${Utils.formatCurrency(t.amount)}</div>
      </div>`;
    }).join('');
  }

  function renderAITip() {
    const txns   = Store.getTransactions();
    const month  = Utils.filterByPeriod(txns, 'month');
    const totals = Utils.calcTotals(month);
    const cats   = Utils.groupByCategory(month);
    const topCat = Object.entries(cats).sort((a,b) => b[1]-a[1])[0];
    const savingsRate = totals.income > 0 ? ((totals.income - totals.expense) / totals.income * 100).toFixed(0) : 0;

    let tip = '', type = '';
    if (!txns.length) {
      tip = "Welcome to Phyzelyne! Start by logging your first income or expense — I'll begin building personalised insights for you right away.";
      type = '';
    } else if (totals.expense > totals.income) {
      tip = `⚠️ You're spending more than you earn this month (${Utils.formatCurrency(totals.expense - totals.income)} over). Let's review your budget — try cutting discretionary spending first.`;
      type = 'warning';
    } else if (topCat && topCat[1] > totals.income * 0.3) {
      tip = `Your top spend category is <strong>${topCat[0]}</strong> at ${Utils.formatCurrency(topCat[1])} — that's ${((topCat[1]/totals.income)*100).toFixed(0)}% of income. Consider setting a category limit.`;
      type = 'warning';
    } else if (savingsRate >= 20) {
      tip = `🎉 Great work! You're saving ${savingsRate}% of your income this month. Keep it up — consistency is the secret to building real wealth.`;
      type = 'positive';
    } else {
      tip = `You've saved ${savingsRate}% of income this month. Aiming for 20% is a strong financial target — small daily cuts compound fast.`;
      type = '';
    }

    document.getElementById('dash-ai-tip').innerHTML = `
      <div class="ai-bubble ${type}">
        <div class="ai-bubble-header"><i class="fas fa-brain"></i> Phyzelyne AI</div>
        <div class="ai-bubble-text">${tip}</div>
      </div>`;
  }

  function renderPage() {
    renderStats();
    renderRecentTxns();
    renderAITip();
  }

  // Boot
  document.getElementById('sidebar-mount').innerHTML = renderSidebar();
  initSidebar();
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-GB', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  populateCatSelect();

  // Update Quick Add placeholder with actual currency symbol once settings load
  function _updateAmountPlaceholder() {
    const cur = getCurrency();
    const el = document.getElementById('q-amount');
    if (el && cur) el.placeholder = `Amount (${cur.symbol})`;
  }

  // Wait for Supabase data before rendering
  async function boot() {
    if (!_cache.ready) {
      await new Promise(resolve => document.addEventListener('phyzelyne:ready', resolve, { once: true }));
    }
    // Personalised greeting
    const user = Auth.getUser();
    const hour = new Date().getHours();
    const tod  = hour < 12 ? 'morning' : hour < 17 ? 'afternoon' : 'evening';
    const firstName = user?.name?.split(' ')[0] || '';
    const el = document.getElementById('greeting-text');
    if (el) el.textContent = firstName ? `Good ${tod}, ${firstName} 👋` : `Good ${tod} 👋`;
    renderPage();
    _updateAmountPlaceholder();

    // Re-render whenever another tab (e.g. Transactions page) mutates data.
    // _cache is already updated by app.js's _initDataSync listener before
    // this event fires, so renderPage() will always see the latest data.
    document.addEventListener('phyzelyne:data-changed', () => {
      renderPage();
    });
  }
  boot();

</script>

<script>
(function(){
  var page = location.pathname.split('/').pop() || 'dashboard.html';
  function _setSmartTab() {
    var smartEl = document.getElementById('bnav-smart-tab');
    if (smartEl) {
      smartEl.outerHTML = '<a href="cofe.html" class="bottom-nav-item" data-page="cofe"><i class="fas fa-brain"></i><span>AI</span></a>';
    }
    document.querySelectorAll('.bottom-nav-item[data-page]').forEach(function(el){
      var p = el.dataset.page;
    if(page.includes(p)||(p==='dashboard'&&['','dashboard.html'].includes(page)))
        el.classList.add('active');
    });
  }
  if (typeof _cache !== 'undefined' && _cache.ready) {
    _setSmartTab();
  } else {
    document.addEventListener('phyzelyne:ready', _setSmartTab, { once: true });
    // Apply active state immediately so the nav looks right while waiting
    document.querySelectorAll('.bottom-nav-item[data-page]').forEach(function(el){
      var p = el.dataset.page;
    if(page.includes(p)||(p==='dashboard'&&['','dashboard.html'].includes(page)))
        el.classList.add('active');
    });
  }
})();
</script>
