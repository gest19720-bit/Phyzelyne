<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Phyzelyne — Feedback Board</title>
  <link rel="icon" type="image/png" href="Phyzelyne's Logo.png">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="phyzelyne-theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .feedback-page { max-width: 1040px; margin: 0 auto; }
    .feedback-hero { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:24px; }
    .feedback-hero h1 { margin-bottom:6px; }
    .feedback-hero p { color:var(--text-dim); max-width:600px; margin:0; }
    .feedback-composer { padding:20px; margin-bottom:18px; border:1px solid var(--gold-border); background:linear-gradient(135deg,var(--glass),var(--gold-dim)); }
    .feedback-toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
    .feedback-toolbar .form-input { width:auto; min-width:150px; }
    .feedback-toolbar .feedback-search { flex:1; min-width:200px; }
    .feedback-card { padding:20px; margin-bottom:12px; }
    .feedback-card-head { display:flex; gap:14px; align-items:flex-start; }
    .feedback-vote { flex:0 0 54px; border:1px solid var(--glass-border); background:var(--glass-dim); color:var(--text-dim); border-radius:14px; padding:8px 5px; cursor:pointer; text-align:center; transition:all var(--transition); }
    .feedback-vote i { display:block; font-size:1rem; margin-bottom:3px; }
    .feedback-vote strong { font-size:.85rem; }
    .feedback-vote:hover,.feedback-vote.voted { color:var(--gold); border-color:var(--gold-border); background:var(--gold-dim); }
    .feedback-title { font-size:1.05rem; font-weight:750; color:var(--text); margin:0 0 6px; }
    .feedback-body { color:var(--text-mid); line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; }
    .feedback-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; color:var(--text-dim); font-size:.76rem; margin-top:12px; }
    .feedback-chip { padding:4px 9px; border-radius:999px; background:var(--gold-dim); color:var(--gold); font-weight:700; text-transform:capitalize; }
    .feedback-status { padding:4px 9px; border-radius:999px; background:var(--green-dim); color:var(--green); font-weight:700; text-transform:capitalize; }
    .feedback-actions { margin-left:auto; display:flex; gap:6px; }
    .feedback-comments { margin:18px 0 0 68px; padding-top:14px; border-top:1px solid var(--glass-border); }
    .feedback-comment { padding:10px 0; border-bottom:1px solid var(--glass-border); }
    .feedback-comment:last-child { border-bottom:0; }
    .feedback-comment.reply { margin-left:24px; padding-left:14px; border-left:2px solid var(--gold-border); }
    .comment-head { display:flex; gap:8px; align-items:center; font-size:.76rem; color:var(--text-dim); }
    .comment-author { font-weight:700; color:var(--text-mid); }
    .comment-body { margin:5px 0 6px; color:var(--text-mid); line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere; }
    .comment-actions { display:flex; gap:10px; }
    .text-action { border:0; background:none; color:var(--gold); cursor:pointer; font-size:.74rem; padding:0; }
    .feedback-comment-box { display:flex; gap:8px; margin-top:14px; }
    .feedback-comment-box textarea { min-height:42px; resize:vertical; }
    .feedback-empty { text-align:center; padding:58px 20px; color:var(--text-dim); }
    .feedback-empty i { font-size:2rem; color:var(--gold); margin-bottom:12px; }
    .feedback-modal { position:fixed; inset:0; z-index:5000; display:none; align-items:center; justify-content:center; padding:18px; background:rgba(0,0,0,.42); }
    .feedback-modal.open { display:flex; }
    .feedback-modal-card { width:min(560px,100%); padding:24px; background:var(--glass-heavy); border:1px solid var(--glass-border); border-radius:24px; box-shadow:var(--shadow-lg); }
    .feedback-modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
    @media(max-width:640px){ .feedback-hero{display:block}.feedback-hero .btn{margin-top:14px}.feedback-toolbar .form-input,.feedback-toolbar .feedback-search{width:100%;min-width:0}.feedback-comments{margin-left:0}.feedback-card{padding:15px}.feedback-actions{width:100%;margin-left:68px}.feedback-comment-box{align-items:stretch}.feedback-comment-box .btn{padding-inline:12px} }
  </style>
</head>
<body>
  <div id="sidebar-mount"></div>
  <div class="app-shell"><main class="main-content"><div class="feedback-page">
    <div class="page-header feedback-hero">
      <div><h1>Feedback Board</h1><p>Help shape what we build next. Share an idea, report a bug, and vote for the improvements that matter to you.</p></div>
      <button class="btn btn-gold" onclick="openPostEditor()"><i class="fas fa-plus"></i> Share feedback</button>
    </div>
    <div class="glass-card feedback-composer"><div style="display:flex;gap:12px;align-items:center;"><div class="icon-box" style="background:var(--gold-dim);color:var(--gold);"><i class="fas fa-lightbulb"></i></div><div><strong>Make Phyzelyne better</strong><div style="font-size:.8rem;color:var(--text-dim);">Your feedback is visible to the community and helps us prioritize.</div></div></div></div>
    <div class="feedback-toolbar"><input class="form-input feedback-search" id="feedback-search" type="search" placeholder="Search feedback…" oninput="renderBoard()"><select class="form-input" id="feedback-category" onchange="renderBoard()"><option value="all">All categories</option><option value="idea">Ideas</option><option value="improvement">Improvements</option><option value="bug">Bugs</option><option value="question">Questions</option></select><select class="form-input" id="feedback-sort" onchange="renderBoard()"><option value="popular">Most liked</option><option value="recent">Most recent</option></select></div>
    <div id="feedback-status" style="display:none;margin-bottom:14px;"></div><div id="feedback-board"></div>
  </div></main></div>
  <div class="feedback-modal" id="feedback-modal" role="dialog" aria-modal="true" aria-labelledby="feedback-modal-title"><div class="feedback-modal-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;"><h2 id="feedback-modal-title" style="margin:0;font-family:var(--font-display);">Share feedback</h2><button class="btn btn-glass btn-sm" onclick="closePostEditor()" aria-label="Close"><i class="fas fa-xmark"></i></button></div><input type="hidden" id="feedback-edit-id"><div class="form-group"><label class="form-label" for="feedback-title">Title</label><input class="form-input" id="feedback-title" maxlength="140" placeholder="What should we improve?"></div><div class="form-group"><label class="form-label" for="feedback-body-input">Details</label><textarea class="form-input" id="feedback-body-input" rows="6" maxlength="5000" placeholder="Tell the community what you need and why it matters."></textarea></div><div class="form-group"><label class="form-label" for="feedback-category-input">Category</label><select class="form-input" id="feedback-category-input"><option value="idea">Idea</option><option value="improvement">Improvement</option><option value="bug">Bug</option><option value="question">Question</option></select></div><div class="feedback-modal-actions"><button class="btn btn-glass" onclick="closePostEditor()">Cancel</button><button class="btn btn-gold" onclick="saveFeedback()"><i class="fas fa-check"></i> Publish feedback</button></div></div></div>
  <nav class="bottom-nav"><a href="dashboard.html" class="bottom-nav-item" data-page="dashboard"><i class="fas fa-house"></i><span>Home</span></a><a href="transactions.html" class="bottom-nav-item" data-page="transactions"><i class="fas fa-right-left"></i><span>Transactions</span></a><a href="analysis.html" class="bottom-nav-item" data-page="analysis"><i class="fas fa-chart-pie"></i><span>Analysis</span></a><a href="cofe.html" class="bottom-nav-item" data-page="cofe"><i class="fas fa-brain"></i><span>AI</span></a><a href="settings.html" class="bottom-nav-item" data-page="settings"><i class="fas fa-gear"></i><span>Settings</span></a></nav>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script src="app.js"></script>
  <script>
    let feedbackItems = [], feedbackUser = null;
    const safe = value => escapeHtml(value == null ? '' : value);
    const dateLabel = value => { const d = new Date(value); return Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); };
    const showStatus = (message, error=false) => { const el=document.getElementById('feedback-status'); el.style.display='block'; el.style.color=error?'var(--red)':'var(--green)'; el.textContent=message; setTimeout(()=>{el.style.display='none'},4500); };
    async function loadBoard(){ try { feedbackUser=await PhFeedback.init(); feedbackItems=await PhFeedback.list(); renderBoard(); } catch(e) { document.getElementById('feedback-board').innerHTML='<div class="glass-card feedback-empty"><i class="fas fa-cloud-exclamation"></i><p>Feedback board is temporarily unavailable.</p><small>'+safe(e.message)+'</small></div>'; } }
    function renderBoard(){ const q=(document.getElementById('feedback-search').value||'').toLowerCase().trim(), cat=document.getElementById('feedback-category').value, sort=document.getElementById('feedback-sort').value; let list=feedbackItems.filter(p=>(cat==='all'||p.category===cat)&&(!q||`${p.title} ${p.body} ${p.author_name}`.toLowerCase().includes(q))); list.sort((a,b)=>sort==='recent'?new Date(b.created_at)-new Date(a.created_at):b.votes-a.votes); const board=document.getElementById('feedback-board'); if(!list.length){board.innerHTML='<div class="glass-card feedback-empty"><i class="fas fa-comments"></i><p>No feedback matches your filters yet.</p><button class="btn btn-gold" onclick="openPostEditor()">Start the conversation</button></div>';return;} board.innerHTML=list.map(postCard).join(''); }
    function postCard(post){ const own=feedbackUser?.id===post.user_id; const roots=(post.comments||[]).filter(c=>!c.parent_id), replies=(post.comments||[]).filter(c=>c.parent_id); return `<article class="glass-card feedback-card"><div class="feedback-card-head"><button class="feedback-vote ${post.voted?'voted':''}" onclick="voteFeedback('${post.id}',${post.voted})" title="${post.voted?'Remove your like':'Like this feedback'}"><i class="fas fa-heart"></i><strong>${post.votes||0}</strong></button><div style="flex:1;min-width:0;"><h3 class="feedback-title">${safe(post.title)}</h3><div class="feedback-body">${safe(post.body)}</div><div class="feedback-meta"><span class="feedback-chip">${safe(post.category)}</span><span class="feedback-status">${safe(String(post.status||'open').replace('_',' '))}</span><span>by ${safe(post.author_name||'Phyzelyne user')} · ${dateLabel(post.created_at)}</span><span>${(post.comments||[]).length} ${(post.comments||[]).length===1?'comment':'comments'}</span></div></div></div><div class="feedback-actions">${own?`<button class="text-action" onclick="openPostEditor('${post.id}')"><i class="fas fa-pen"></i> Edit</button><button class="text-action" style="color:var(--red);" onclick="deleteFeedback('${post.id}')"><i class="fas fa-trash"></i> Delete</button>`:''}</div>${roots.length||replies.length?`<div class="feedback-comments">${roots.map(c=>commentMarkup(c,replies)).join('')}</div>`:''}<div class="feedback-comment-box"><textarea class="form-input" id="comment-${post.id}" rows="1" placeholder="Add a comment or question…"></textarea><button class="btn btn-glass btn-sm" onclick="addFeedbackComment('${post.id}')">Comment</button></div></article>`; }
    function commentMarkup(comment,replies){ const own=feedbackUser?.id===comment.user_id; return `<div class="feedback-comment"><div class="comment-head"><span class="comment-author">${safe(comment.author_name||'User')}</span><span>${dateLabel(comment.created_at)}</span></div><div class="comment-body">${safe(comment.body)}</div><div class="comment-actions">${feedbackUser?`<button class="text-action" onclick="replyTo('${comment.post_id}','${comment.id}')">Reply</button>`:''}${own?`<button class="text-action" onclick="editComment('${comment.id}')">Edit</button><button class="text-action" style="color:var(--red);" onclick="deleteComment('${comment.id}')">Delete</button>`:''}</div>${(replies||[]).filter(r=>r.parent_id===comment.id).map(r=>`<div class="feedback-comment reply">${commentMarkup(r,[] )}</div>`).join('')}</div>`; }
    async function requireLogin(){ if(feedbackUser) return true; if(confirm('Sign in to participate in the feedback board?')) location.href='login.html?redirect=feedback.html'; return false; }
    async function voteFeedback(id,voted){ if(!await requireLogin())return; try{await PhFeedback.toggleVote(id,voted);await loadBoard();}catch(e){showStatus(e.message,true);} }
    function openPostEditor(id){ if(!feedbackUser){requireLogin();return;} const post=id&&feedbackItems.find(p=>p.id===id); document.getElementById('feedback-edit-id').value=post?.id||'';document.getElementById('feedback-title').value=post?.title||'';document.getElementById('feedback-body-input').value=post?.body||'';document.getElementById('feedback-category-input').value=post?.category||'idea';document.getElementById('feedback-modal-title').textContent=post?'Edit feedback':'Share feedback';document.querySelector('#feedback-modal .btn-gold').innerHTML=post?'<i class="fas fa-check"></i> Save changes':'<i class="fas fa-check"></i> Publish feedback';document.getElementById('feedback-modal').classList.add('open');document.getElementById('feedback-title').focus(); }
    function closePostEditor(){document.getElementById('feedback-modal').classList.remove('open');}
    async function saveFeedback(){ try{const id=document.getElementById('feedback-edit-id').value;const data={title:document.getElementById('feedback-title').value,body:document.getElementById('feedback-body-input').value,category:document.getElementById('feedback-category-input').value};if(id)await PhFeedback.update(id,data);else await PhFeedback.create(data);closePostEditor();showStatus(id?'Feedback updated.':'Feedback published.');await loadBoard();}catch(e){showStatus(e.message,true);} }
    async function deleteFeedback(id){if(!await requireLogin()||!confirm('Delete this feedback and its comments?'))return;try{await PhFeedback.remove(id);showStatus('Feedback deleted.');await loadBoard();}catch(e){showStatus(e.message,true);}}
    async function addFeedbackComment(postId,parentId=null){if(!await requireLogin())return;const input=document.getElementById('comment-'+postId);const body=input?.value||prompt(parentId?'Write your reply':'Write a comment');if(!body?.trim())return;try{await PhFeedback.comment({postId,body,parentId});if(input)input.value='';showStatus(parentId?'Reply added.':'Comment added.');await loadBoard();}catch(e){showStatus(e.message,true);}}
    async function replyTo(postId,parentId){const body=prompt('Write your reply');if(body?.trim())try{await PhFeedback.comment({postId,body,parentId});await loadBoard();}catch(e){showStatus(e.message,true);}}
    async function editComment(id){const comment=feedbackItems.flatMap(p=>p.comments||[]).find(c=>c.id===id);const next=prompt('Edit your comment',comment?.body||'');if(next===null)return;try{await PhFeedback.updateComment(id,next);await loadBoard();}catch(e){showStatus(e.message,true);}}
    async function deleteComment(id){if(!confirm('Delete this comment?'))return;try{await PhFeedback.removeComment(id);await loadBoard();}catch(e){showStatus(e.message,true);}}
    document.getElementById('feedback-modal').addEventListener('click',e=>{if(e.target.id==='feedback-modal')closePostEditor();});
    loadBoard();
  </script>
</body></html>
