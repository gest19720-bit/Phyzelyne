<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phyzelyne — Transactions</title>
  <link rel="icon" type="image/png" href="Phyzelyne's Logo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="app.css">
  <style>
    .txn-actions { display:flex; gap:6px; align-items:center; }
    .txn-edit {
      background: var(--gold-dim);
      border: 1px solid var(--gold-border);
      color: var(--gold);
      border-radius: 8px;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 0.78rem;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    .txn-edit:hover { background: var(--gold); color: #fff; }
    .txn-delete {
      background: var(--red-dim);
      border: 1px solid rgba(192,57,43,0.25);
      color: var(--red);
      border-radius: 8px;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 0.78rem;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    .txn-delete:hover { background: var(--red); color: #fff; }
    .type-btn.subscription.active {
      background: var(--gold-dim);
      border-color: rgba(212,160,23,0.35);
      color: var(--gold);
    }
    .txn-icon.subscription {
      background: var(--gold-dim);
      color: var(--gold);
    }
    .txn-amount.subscription {
      color: var(--gold);
    }
    .txn-receipt {
      background: rgba(var(--accent-rgb, 212, 160, 23), 0.12);
      border: 1px solid var(--gold-border);
      color: var(--gold);
      border-radius: 8px;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 0.78rem;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    .txn-receipt:hover { background: var(--gold); color: #fff; }
    .receipt-modal-img-container {
      width: 100%;
      max-height: 70vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.2);
    }
    .receipt-modal-img-container img {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
    }
  </style>
</head>
<body>

<div id="sidebar-mount"></div>

<div class="app-shell">
  <main class="main-content">
    <div class="page-header">
      <h1>Transactions</h1>
      <p>Every penny in and out — captured.</p>
    </div>

    <!-- Controls -->
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:24px;">
      <div class="period-tabs" id="period-tabs">
        <button class="period-tab active" data-period="month">This Month</button>
        <button class="period-tab" data-period="week">This Week</button>
        <button class="period-tab" data-period="year">This Year</button>
        <button class="period-tab" data-period="all">All Time</button>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <select class="form-input" id="filter-type" style="width:auto;border-radius:9999px;padding:8px 16px;font-size:0.8rem;">
          <option value="all">All Types</option>
          <option value="income">Income only</option>
          <option value="expense">Expenses only</option>
          <option value="subscription">Subscriptions only</option>
        </select>
        <select class="form-input" id="filter-cat" style="width:auto;border-radius:9999px;padding:8px 16px;font-size:0.8rem;">
          <option value="all">All Categories</option>
        </select>
        <button class="btn btn-gold" onclick="openModal()">
          <i class="fas fa-plus"></i> Add New
        </button>
      </div>
    </div>

    <!-- Summary strip -->
    <div class="stats-grid" id="txn-stats" style="margin-bottom:24px;"></div>

    <!-- Transaction list -->
    <div class="glass-card" style="padding:28px;">
      <div class="txn-list" id="txn-list"></div>
    </div>
  </main>
</div>

<!-- Add / Edit Transaction Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">New Transaction</div>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="type-toggle">
      <button class="type-btn income active" id="m-income" onclick="setType('income')">
        <i class="fas fa-plus"></i> Income
      </button>
      <button class="type-btn expense" id="m-expense" onclick="setType('expense')">
        <i class="fas fa-minus"></i> Expense
      </button>
      <button class="type-btn subscription" id="m-subscription" onclick="setType('subscription')">
        <i class="fas fa-repeat"></i> Subscription
      </button>
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <input type="text" class="form-input" id="m-desc" placeholder="e.g. Tesco Groceries">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Amount</label>
        <input type="number" class="form-input" id="m-amount" placeholder="0.00" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label class="form-label">Date</label>
        <input type="date" class="form-input" id="m-date">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Category</label>
      <select class="form-input" id="m-cat"></select>
    </div>
    <div class="form-group" id="group-cycle" style="display:none;">
      <label class="form-label">Billing Cycle</label>
      <select class="form-input" id="m-cycle">
        <option value="weekly">Weekly</option>
        <option value="monthly" selected>Monthly</option>
        <option value="yearly">Yearly</option>
      </select>
    </div>
    <div class="form-group" id="group-photo" style="display:none; margin-top:12px;">
      <label class="form-label">Receipt Photo</label>
      <div style="display:flex; gap:12px; align-items:center;">
        <div id="photo-preview-container" style="width: 64px; height: 64px; border-radius: 8px; border: 1px dashed var(--gold-border); display:flex; align-items:center; justify-content:center; overflow:hidden; background: var(--glass-dim); flex-shrink:0;">
          <span id="photo-placeholder" style="font-size:0.65rem; color:var(--text-dim); text-align:center; padding: 4px;">No Photo</span>
          <img id="photo-preview" style="display:none; width: 100%; height: 100%; object-fit: cover;">
        </div>
        <div style="display:flex; flex-direction:column; gap:6px; flex:1;">
          <div style="display:flex; gap:6px;">
            <label class="btn btn-glass btn-sm" style="cursor: pointer; margin: 0; padding: 6px 12px; font-size: 0.75rem; flex:1; justify-content:center; display:inline-flex; align-items:center; gap:4px;">
              <i class="fas fa-upload"></i> Upload
              <input type="file" id="photo-input" accept="image/*" style="display: none;" onchange="handlePhotoUpload(event)">
            </label>
            <button class="btn btn-glass btn-sm" id="btn-take-photo" onclick="startCamera()" style="padding: 6px 12px; font-size: 0.75rem; flex:1; justify-content:center; display:inline-flex; align-items:center; gap:4px;">
              <i class="fas fa-camera"></i> Camera
            </button>
          </div>
          <button class="btn btn-danger btn-sm" id="btn-remove-photo" onclick="removePhoto()" style="display: none; padding: 4px 12px; font-size: 0.75rem; width:100%; justify-content:center; align-items:center; gap:4px;">
            <i class="fas fa-circle-xmark"></i> Remove Photo
          </button>
        </div>
      </div>
      <!-- Inline Camera Feed -->
      <div id="camera-container" style="display:none; margin-top:12px; flex-direction:column; gap:8px; border: 1px solid var(--gold-border); border-radius: 8px; padding: 8px; background: var(--surface);">
        <video id="camera-feed" autoplay playsinline style="width:100%; max-height:180px; border-radius:4px; object-fit:cover; background:#000;"></video>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-gold btn-sm" style="flex:1; justify-content:center; display:inline-flex; align-items:center; gap:4px;" onclick="capturePhoto()"><i class="fas fa-circle"></i> Capture</button>
          <button class="btn btn-glass btn-sm" style="flex:1; justify-content:center; display:inline-flex; align-items:center; gap:4px;" onclick="stopCamera()"><i class="fas fa-times"></i> Cancel</button>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="btn btn-glass" style="flex:1;" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold" style="flex:1;" id="modal-save-btn" onclick="submitTransaction()">
        <i class="fas fa-check"></i> Save
      </button>
    </div>
  </div>
</div>

<!-- Full Screen Receipt Modal -->
<div class="modal-overlay" id="receipt-modal">
  <div class="modal" style="max-width: 480px; padding: 24px; text-align: center;">
    <div class="modal-header">
      <div class="modal-title"><i class="fas fa-receipt"></i> Receipt Photo</div>
      <button class="modal-close" onclick="closeReceiptModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="receipt-modal-img-container" style="margin-top: 16px;">
      <img id="receipt-modal-img" alt="Receipt Photo">
    </div>
    <div style="margin-top:20px; display:flex; justify-content:flex-end;">
      <button class="btn btn-glass" onclick="closeReceiptModal()">Close</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>Auth.require();</script>

<script>
  /* ── Extended category lists ── */
  const CATS_INCOME  = [
    'salary','freelance','investment','bonus','commission',
    'pension','rental income','dividends','allowance','gift','other'
  ];
  const CATS_EXPENSE = [
    // Food
    'groceries','dining','coffee',
    // Home
    'rent','mortgage','bills','utilities','internet','repairs','cleaning',
    // Transport
    'transport','fuel','parking','toll',
    // Lifestyle
    'entertainment','streaming','gaming','books','sports','gym',
    // Personal
    'clothing','beauty','haircut','health','medical','dental','pharmacy',
    'personal','laundry',
    // Family
    'childcare','pets','gifts',
    // Education & Work
    'education','shopping','travel',
    // Finance
    'insurance','subscriptions','transfer','payment','loan repayment','tax',
    'charity','other'
  ];
  const CATS_TRANSFER = ['transfer','bank transfer','payment','loan repayment','other'];

  let currentPeriod = 'month';
  let currentType   = 'income';
  let filterType    = 'all';
  let filterCat     = 'all';
  let editingId     = null; // null = new, string = editing

  let currentPhotoBase64 = null;
  let videoStream = null;

  async function startCamera() {
    const container = document.getElementById('camera-container');
    const video = document.getElementById('camera-feed');
    if (!container || !video) return;
    container.style.display = 'flex';
    try {
      videoStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' },
        audio: false
      });
      video.srcObject = videoStream;
    } catch (err) {
      showToast('Could not access camera', 'error');
      container.style.display = 'none';
    }
  }

  function stopCamera() {
    if (videoStream) {
      videoStream.getTracks().forEach(track => track.stop());
      videoStream = null;
    }
    const container = document.getElementById('camera-container');
    if (container) container.style.display = 'none';
  }

  function capturePhoto() {
    const video = document.getElementById('camera-feed');
    if (!videoStream || !video) return;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

    const img = new Image();
    img.onload = function() {
      compressImage(img, function(compressedBase64) {
        setReceiptPhoto(compressedBase64);
        stopCamera();
      });
    };
    img.src = dataUrl;
  }

  function handlePhotoUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 1024 * 1024 * 5) {
      showToast('Image is too large. Keep it under 5MB', 'error');
      return;
    }
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        compressImage(img, function(compressedBase64) {
          setReceiptPhoto(compressedBase64);
        });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function compressImage(img, callback) {
    const canvas = document.createElement('canvas');
    const max_size = 800;
    let width = img.width;
    let height = img.height;
    if (width > height) {
      if (width > max_size) {
        height *= max_size / width;
        width = max_size;
      }
    } else {
      if (height > max_size) {
        width *= max_size / height;
        height = max_size;
      }
    }
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, width, height);
    callback(canvas.toDataURL('image/jpeg', 0.7));
  }

  function setReceiptPhoto(base64Data) {
    currentPhotoBase64 = base64Data;
    const preview = document.getElementById('photo-preview');
    const placeholder = document.getElementById('photo-placeholder');
    const removeBtn = document.getElementById('btn-remove-photo');
    if (preview && placeholder && removeBtn) {
      preview.src = base64Data;
      preview.style.display = 'block';
      placeholder.style.display = 'none';
      removeBtn.style.display = 'inline-flex';
    }
  }

  function removePhoto() {
    currentPhotoBase64 = null;
    const preview = document.getElementById('photo-preview');
    const placeholder = document.getElementById('photo-placeholder');
    const removeBtn = document.getElementById('btn-remove-photo');
    const input = document.getElementById('photo-input');
    if (preview && placeholder && removeBtn) {
      preview.src = '';
      preview.style.display = 'none';
      placeholder.style.display = 'block';
      removeBtn.style.display = 'none';
    }
    if (input) input.value = '';
    stopCamera();
  }

  function viewReceiptImage(base64Data) {
    const modal = document.getElementById('receipt-modal');
    const img = document.getElementById('receipt-modal-img');
    if (modal && img) {
      img.src = base64Data;
      modal.classList.add('open');
    }
  }

  function closeReceiptModal() {
    const modal = document.getElementById('receipt-modal');
    const img = document.getElementById('receipt-modal-img');
    if (modal && img) {
      modal.classList.remove('open');
      img.src = '';
    }
  }

  function parseTxn(t) {
    if (!t) return null;
    const match = (t.description || '').match(/(.*) \[(weekly|monthly|yearly)\]$/);
    if (match) {
      return {
        ...t,
        uiType: 'subscription',
        uiDesc: match[1],
        cycle: match[2]
      };
    }
    return {
      ...t,
      uiType: t.type,
      uiDesc: t.description || '',
      cycle: null
    };
  }

  function getCatsForType(type) {
    if (type === 'income') return CATS_INCOME;
    if (type === 'subscription') return ['subscriptions'];
    return CATS_EXPENSE;
  }

  function setType(type) {
    currentType = type;
    document.getElementById('m-income').classList.toggle('active', type === 'income');
    document.getElementById('m-expense').classList.toggle('active', type === 'expense');
    document.getElementById('m-subscription').classList.toggle('active', type === 'subscription');

    const descLabel = document.querySelector('#m-desc').previousElementSibling;
    const descInput = document.getElementById('m-desc');
    const cycleGroup = document.getElementById('group-cycle');
    const catGroup = document.getElementById('m-cat').parentNode;
    const photoGroup = document.getElementById('group-photo');

    if (photoGroup) {
      photoGroup.style.display = type === 'expense' ? 'block' : 'none';
    }

    if (type !== 'expense') {
      stopCamera();
    }

    if (type === 'subscription') {
      if (descLabel) descLabel.textContent = 'Service or App Name';
      descInput.placeholder = 'e.g. Netflix, Spotify';
      cycleGroup.style.display = 'block';
      catGroup.style.display = 'none';
    } else {
      if (descLabel) descLabel.textContent = 'Description';
      descInput.placeholder = 'e.g. Tesco Groceries';
      cycleGroup.style.display = 'none';
      catGroup.style.display = 'block';
      populateCatSelect('m-cat', type);
    }
  }

  function populateCatSelect(id, type, selected) {
    const cats = getCatsForType(type);
    document.getElementById(id).innerHTML = cats.map(c =>
      `<option value="${c}"${c === selected ? ' selected' : ''}>${c.charAt(0).toUpperCase()+c.slice(1)}</option>`
    ).join('');
  }

  function openModal(editId) {
    editingId = editId || null;
    if (editId) {
      // Edit mode — pre-fill
      const rawTxn = Store.getTransactions().find(t => t.id === editId);
      if (!rawTxn) return;
      const txn = parseTxn(rawTxn);
      document.getElementById('modal-title').textContent = 'Edit Transaction';
      document.getElementById('modal-save-btn').innerHTML = '<i class="fas fa-pen"></i> Update';
      
      setType(txn.uiType);
      
      if (txn.uiType === 'subscription') {
        document.getElementById('m-cycle').value = txn.cycle || 'monthly';
      }
      
      document.getElementById('m-desc').value   = txn.uiDesc;
      document.getElementById('m-amount').value = txn.amount;
      document.getElementById('m-date').value   = txn.date;

      if (txn.uiType === 'expense' && rawTxn.image) {
        setReceiptPhoto(rawTxn.image);
      } else {
        removePhoto();
      }
    } else {
      // New mode
      document.getElementById('modal-title').textContent = 'New Transaction';
      document.getElementById('modal-save-btn').innerHTML = '<i class="fas fa-check"></i> Save';
      document.getElementById('m-date').value = new Date().toISOString().split('T')[0];
      setType(currentType);
      document.getElementById('m-desc').value   = '';
      document.getElementById('m-amount').value = '';
      if (currentType === 'subscription') {
        document.getElementById('m-cycle').value = 'monthly';
      }
      removePhoto();
    }
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    editingId = null;
    document.getElementById('m-desc').value   = '';
    document.getElementById('m-amount').value = '';
    removePhoto();
  }

  function submitTransaction() {
    const descInput = document.getElementById('m-desc').value.trim();
    const amount = parseFloat(document.getElementById('m-amount').value);
    const date   = document.getElementById('m-date').value;
    
    if (!descInput) { 
      showToast(currentType === 'subscription' ? 'Enter a service or app name' : 'Enter a description', 'error'); 
      return; 
    }
    if (!amount || amount <= 0) { showToast('Enter a valid amount', 'error'); return; }

    let type = currentType;
    let description = descInput;
    let category = '';

    if (currentType === 'subscription') {
      type = 'expense';
      const cycle = document.getElementById('m-cycle').value;
      description = `${descInput} [${cycle}]`;
      category = 'subscriptions';
    } else {
      category = document.getElementById('m-cat').value;
    }

    let image = null;
    if (currentType === 'expense' && currentPhotoBase64) {
      image = currentPhotoBase64;
    }

    if (editingId) {
      Store.updateTransaction(editingId, { type, amount, description, category, date, image });
      showToast('Transaction updated!');
    } else {
      Store.addTransaction({ type, amount, description, category, date, image });
      showToast('Transaction saved!');
    }
    closeModal();
    renderPage();
  }

  function deleteTxn(id) {
    if (!confirm('Delete this transaction?')) return;
    Store.deleteTransaction(id);
    showToast('Deleted', 'error');
    renderPage();
  }

  function renderStats() {
    const txns   = Store.getTransactions();
    const filt   = Utils.filterByPeriod(txns, currentPeriod);
    const totals = Utils.calcTotals(filt);
    document.getElementById('txn-stats').innerHTML = `
      <div class="glass-card stat-card">
        <div class="stat-label"><i class="fas fa-arrow-down"></i> Income</div>
        <div class="stat-value income">${Utils.formatCurrency(totals.income, true)}</div>
      </div>
      <div class="glass-card stat-card">
        <div class="stat-label"><i class="fas fa-arrow-up"></i> Expenses</div>
        <div class="stat-value expense">${Utils.formatCurrency(totals.expense, true)}</div>
      </div>
      <div class="glass-card stat-card">
        <div class="stat-label"><i class="fas fa-scale-balanced"></i> Net</div>
        <div class="stat-value ${totals.balance >= 0 ? 'income':'expense'}">${Utils.formatCurrency(totals.balance)}</div>
      </div>
      <div class="glass-card stat-card">
        <div class="stat-label"><i class="fas fa-list"></i> Transactions</div>
        <div class="stat-value" style="font-size:2rem;">${filt.length}</div>
      </div>`;
  }

  function renderList() {
    let txns = Utils.filterByPeriod(Store.getTransactions(), currentPeriod);
    
    // Parse all transactions to support subscriptions in UI
    const parsedTxns = txns.map(parseTxn);
    
    let filtered = parsedTxns;
    if (filterType !== 'all') {
      filtered = filtered.filter(t => t.uiType === filterType);
    }
    if (filterCat !== 'all') {
      filtered = filtered.filter(t => t.category === filterCat);
    }

    const el = document.getElementById('txn-list');
    if (!filtered.length) {
      el.innerHTML = `<div class="empty-state"><i class="fas fa-receipt"></i><p>No transactions found for this period.</p></div>`;
      return;
    }
    el.innerHTML = filtered.map(t => {
      let icon = Utils.getCategoryIcon(t.category);
      if (t.uiType === 'subscription') {
        icon = 'fa-repeat';
      }
      const badgeText = t.uiType === 'subscription'
        ? `${t.category} • ${t.cycle.charAt(0).toUpperCase() + t.cycle.slice(1)}`
        : t.category;

      const raw = Store.getTransactions().find(item => item.id === t.id);
      const hasReceipt = raw && raw.image;
      const receiptBtn = hasReceipt 
        ? `<button class="txn-receipt" onclick="viewReceiptImage('${raw.image}')" title="View Receipt"><i class="fas fa-receipt"></i></button>`
        : '';

      return `
      <div class="txn-item">
        <div class="txn-icon ${t.uiType}"><i class="fas ${icon}"></i></div>
        <div class="txn-info">
          <div class="txn-name">${t.uiDesc}</div>
          <div class="txn-meta">
            <span class="txn-cat-badge">${badgeText}</span>
            ${Utils.formatDate(t.date)}
          </div>
        </div>
        <div class="txn-amount ${t.uiType}">${t.uiType === 'income' ? '+' : '-'}${Utils.formatCurrency(t.amount)}</div>
        <div class="txn-actions">
          ${receiptBtn}
          <button class="txn-edit" onclick="openModal('${t.id}')" title="Edit"><i class="fas fa-pen"></i></button>
          <button class="txn-delete" onclick="deleteTxn('${t.id}')" title="Delete"><i class="fas fa-trash-can"></i></button>
        </div>
      </div>`;
    }).join('');
  }

  function populateFilterCats() {
    const all = [...new Set(Store.getTransactions().map(t => t.category))].sort();
    const sel = document.getElementById('filter-cat');
    sel.innerHTML = `<option value="all">All Categories</option>` +
      all.map(c => `<option value="${c}">${c.charAt(0).toUpperCase()+c.slice(1)}</option>`).join('');
  }

  function renderPage() {
    populateFilterCats();
    renderStats();
    renderList();
  }

  // Period tabs
  document.getElementById('period-tabs').addEventListener('click', e => {
    const tab = e.target.closest('.period-tab');
    if (!tab) return;
    document.querySelectorAll('.period-tab').forEach(b => b.classList.remove('active'));
    tab.classList.add('active');
    currentPeriod = tab.dataset.period;
    renderPage();
  });

  document.getElementById('filter-type').addEventListener('change', e => { filterType = e.target.value; renderPage(); });
  document.getElementById('filter-cat').addEventListener('change', e => { filterCat = e.target.value; renderPage(); });

  // Close modal on overlay click
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target === document.getElementById('modal')) closeModal();
  });

  // Close receipt modal on overlay click
  document.getElementById('receipt-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('receipt-modal')) closeReceiptModal();
  });

  document.getElementById('sidebar-mount').innerHTML = renderSidebar();
  initSidebar();

  async function boot() {
    if (!_cache.ready) {
      await new Promise(resolve => document.addEventListener('phyzelyne:ready', resolve, { once: true }));
    }
    renderPage();

    document.addEventListener('phyzelyne:data-changed', (evt) => {
      if (evt.detail?.type === 'transactions' || evt.detail?.type === 'all') {
        renderPage();
      }
    });
  }
  boot();
</script>

<script>
(function(){
  var page = location.pathname.split('/').pop() || 'dashboard.html';
  function _setSmartTab() {
    var smartEl = document.getElementById('bnav-smart-tab');
    if (smartEl) {
      smartEl.outerHTML = '<a href="ai.html" class="bottom-nav-item" data-page="ai"><i class="fas fa-brain"></i><span>AI</span></a>';
    }
    document.querySelectorAll('.bottom-nav-item[data-page]').forEach(function(el){
      var p = el.dataset.page;
    if(page.includes(p)||(p==='dashboard'&&['','dashboard.html'].includes(page)))
        el.classList.add('active');
    });
  }
  if (typeof _cache !== 'undefined' && _cache.ready) {
    _setSmartTab();
  } else {
    document.addEventListener('phyzelyne:ready', _setSmartTab, { once: true });
    document.querySelectorAll('.bottom-nav-item[data-page]').forEach(function(el){
      var p = el.dataset.page;
    if(page.includes(p)||(p==='dashboard'&&['','dashboard.html'].includes(page)))
        el.classList.add('active');
    });
  }
})();
</script>
